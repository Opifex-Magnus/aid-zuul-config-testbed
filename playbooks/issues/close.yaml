- hosts: localhost
  gather_facts: false
  tasks:
    - name: Close the merged pull requests' linked issues
      when: zuul.branch == 'main'
      block:
        - name: A directory of its own for the App's key and token
          ansible.builtin.tempfile:
            state: directory
            suffix: -issues
          register: issues_dir
        - name: The App's key, readable by the job alone
          ansible.builtin.copy:
            content: "{{ aid_release_github.private_key }}"
            dest: "{{ issues_dir.path }}/key.pem"
            mode: "0600"
          vars:
            ansible_remote_tmp: "{{ issues_dir.path }}"
          no_log: true
        - name: A repository-scoped token with only the closer's permissions
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../release/github-app-token.py"
              - --app-id
              - "{{ aid_release_github.app_id }}"
              - --repository
              - kristofk/AIDepartment
              - --permission
              - contents=read
              - --permission
              - pull_requests=read
              - --permission
              - issues=write
              - --key-file
              - "{{ issues_dir.path }}/key.pem"
              - --keep
              - "{{ issues_dir.path }}/token"
          changed_when: false
        - name: The App's key removed
          ansible.builtin.file:
            path: "{{ issues_dir.path }}/key.pem"
            state: absent
        - name: Close only issues linked to the default-branch PRs in this push
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/close.py"
              - --repository
              - kristofk/AIDepartment
              - --oldrev
              - "{{ zuul.oldrev }}"
              - --newrev
              - "{{ zuul.newrev }}"
              - --branch
              - "{{ zuul.branch }}"
              - --token-file
              - "{{ issues_dir.path }}/token"
          register: issues_closed
          changed_when: (issues_closed.stdout | from_json).closed | length > 0
        - name: What it closed
          ansible.builtin.debug:
            msg: "{{ issues_closed.stdout | from_json }}"
      always:
        - name: The App's token revoked
          ansible.builtin.command:
            argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../release/github-app-token.py",
                   --revoke, "{{ issues_dir.path }}/token"]
          changed_when: false
          failed_when: false
          when: issues_dir.path is defined
        - name: Its directory removed
          ansible.builtin.file:
            path: "{{ issues_dir.path }}"
            state: absent
          when: issues_dir.path is defined
