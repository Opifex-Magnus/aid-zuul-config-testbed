# The pre-run of every job that has a secret (AIDepartment's deploy/zuul/job-secrets.md), before any of its other
# playbooks. Trusted, so no pull request changes it. Zuul already keeps such a job out of every pre-review pipeline
# (post-review: true); this fails it, before anything uses the secret, unless it runs
#   - on a ref, never a proposed change: what was merged or tagged, which a post-review pipeline that took pull
#     requests (a gate made post-review) would otherwise let through;
#   - in one of its job's secret_pipelines, for one of its secret_projects (canonical names), set by the job itself,
#     which is final, so no variant or project changes them.
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Where the secret may go
      ansible.builtin.set_fact:
        secret_allowed: >-
          {{ zuul.change is not defined
             and zuul.pipeline in secret_pipelines
             and zuul.project.canonical_name in secret_projects }}
    - name: Do not retry a job refused here
      zuul_return:
        data:
          zuul:
            retry: false
      when: not secret_allowed
    - name: Run only where the secret may go
      ansible.builtin.assert:
        that: secret_allowed
        fail_msg: >-
          {{ zuul.job }} has a secret, and runs only on a merged ref of {{ secret_projects | join(', ') }} in
          {{ secret_pipelines | join(', ') }}: not on {{ zuul.project.canonical_name }}
          {{ ('change ' ~ zuul.change) if zuul.change is defined else zuul.ref }} in {{ zuul.pipeline }}
          (AIDepartment's deploy/zuul/job-secrets.md)
        success_msg: "{{ zuul.job }} may have its secret here: {{ zuul.ref }} in {{ zuul.pipeline }}"
