# aid-release-credentials's run (zuul.d/release.yaml), on the executor: the release's GitHub App makes a token for
# AIDepartment with the permission a release needs, checked and revoked at once (github-app-token.py). What it
# prints is the App, its key's fingerprint as the App's settings show it, and what GitHub granted: never the key or
# the token. The fingerprint is how a rotation is seen to have reached Zuul (AIDepartment's deploy/zuul/job-secrets.md).
#
# The helper's task has no secret in its arguments, and so no no_log: Zuul's command module keeps none of a no_log
# task's output, not even for register (AIDepartment#1542). The key reaches the helper as a file instead, written by a
# no_log task into a directory of its own in the job's temporary directory (Zuul's TMP, a tmpfs in the playbook's
# bubblewrap sandbox), and removed whatever happens.
- hosts: localhost
  gather_facts: false
  tasks:
    - name: The App's key for the helper, used and removed
      block:
        - name: A directory of its own for the App's key
          ansible.builtin.tempfile:
            state: directory
            suffix: -release-key
          register: release_key_dir
        - name: The App's key, readable by the job alone
          ansible.builtin.copy:
            content: "{{ aid_release_github.private_key }}"
            dest: "{{ release_key_dir.path }}/key.pem"
            mode: "0600"
          # Ansible stages what it copies in its remote_tmp, by default in the job's home on the executor's disk:
          # here, beside the key.
          vars:
            ansible_remote_tmp: "{{ release_key_dir.path }}"
          no_log: true
        # Fails here when the helper does, with its {"error": ...}, which names what GitHub answered.
        - name: A token of the release's App, made, checked and revoked
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/github-app-token.py"
              - --app-id
              - "{{ aid_release_github.app_id }}"
              - --repository
              - kristofk/AIDepartment
              - --permission
              - contents=write
              - --key-file
              - "{{ release_key_dir.path }}/key.pem"
          register: release_token
          changed_when: false
      always:
        - name: The App's key removed
          ansible.builtin.file:
            path: "{{ release_key_dir.path }}"
            state: absent
          when: release_key_dir.path is defined
        # The same as the log shows, which Zuul's builds API shows (/api/tenant/aid/builds?job_name=...), with no log
        # store needed to read it. On a failure too, when the helper said why.
        - name: What GitHub granted, as the build's artifact
          zuul_return:
            data:
              zuul:
                artifacts:
                  - name: release-credential
                    url: "https://github.com/apps/{{ (release_token.stdout | from_json).app_slug | default('aid-release') }}"
                    metadata: "{{ release_token.stdout | from_json }}"
          when: release_token.stdout | default('') is match('{')
    - name: What GitHub granted
      ansible.builtin.debug:
        msg: "{{ release_token.stdout | from_json }}"
    - name: The release's credential works
      ansible.builtin.assert:
        that:
          - release_token.rc == 0
          - (release_token.stdout | from_json).revoked
