# This trusted, level-zero pre-run rejects external jobs before any untrusted pre/run/post/
# cleanup playbook. Zuul skips descendants' post/cleanup playbooks when this level fails.
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Do not retry jobs rejected by the external-node boundary
      zuul_return:
        data:
          zuul:
            retry: false
      when: zuul.pipeline == 'check-external'
    - name: Require a credential-free execution boundary for external checks
      ansible.builtin.assert:
        that: zuul.pipeline != 'check-external'
        fail_msg: "check-external is blocked until a credential-free node is available (AIDepartment#1345)"

# The staging node starts from its image (AIDepartment#1655), before anything is put on it.
- import_playbook: staging-reset.yaml

# Both roles are Zuul's own (zuul/zuul-jobs), reached only after the pipeline guard.
- hosts: all
  roles:
    # The live log of a running job, which zuul-web streams from the node's console daemon.
    - start-zuul-console
    # ~/zuul-output/{logs,artifacts,docs} on the node, empty: what a job puts in logs/ is stored with the build's logs
    # (post-logs.yaml).
    - ensure-output-dirs
    # Checks out the code: every project of the job, at the state Zuul prepared (the change under test merged onto
    # its branch, and onto the changes ahead of it in the gate).
    - prepare-workspace-git
