# The push stage of a publishing job (zuul.d/publish.yaml), on its post node: stage.yaml, with the credentials the
# job's publish_stages gives this stage.
- hosts: all
  tasks:
    - name: The push stage
      ansible.builtin.include_tasks: stage.yaml
      vars:
        publish_stage: push
        publish_permissions: "{{ publish_stages.push.permissions }}"
        publish_pusher: "{{ publish_stages.push.pusher | default(false) }}"
