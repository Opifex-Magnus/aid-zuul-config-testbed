# The base job (https://zuul-ci.org/docs/zuul/latest/config/job.html), which every job inherits. Trusted: only a
# config project may define a job with no parent, and its playbooks run outside the sandbox that untrusted
# playbooks get. Keep it to what every job needs before and after its own run, and nothing that builds.

- job:
    name: base
    parent: null
    description: |
      Every job's parent. Rejects check-external until credential-free nodes exist. For permitted pipelines, starts
      the console stream and puts the change under test, merged onto its branch and
      onto the changes ahead of it, into the node's workspace (~/src/<host>/<owner>/<repository>). Afterwards,
      keeps the build's logs in Zuul's log store, where the build's page shows them (AIDepartment deploy/zuul/web.md).
    pre-run: playbooks/base/pre.yaml
    # The last post-run of every job, since a child's post-run playbooks run before its parent's: whatever a job's own
    # post-run left in ~/zuul-output/logs is stored too.
    post-run: playbooks/base/post-logs.yaml
    roles:
      - zuul: zuul/zuul-jobs
    # AIDepartment's checks time out after 2 hours today (its docs/development.md); a job sets less if it needs less.
    timeout: 7200
    nodeset:
      nodes:
        # The build node (AIDepartment#1345): Bazelisk, git and the scripts' tools. The launcher's provider for the
        # label comes with AIDepartment#1345.
        - name: node
          label: aid-node
